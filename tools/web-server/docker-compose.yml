# Self-hosted grinder cloud: web app (flasher + analytics dashboard + sync
# API + accounts) plus Postgres. Run from tools/web-server:
#   BETTER_AUTH_SECRET=$(openssl rand -hex 32) docker compose up -d
# Then point the flasher's WiFi & Sync provisioning at http://<host>:3000.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/sgbw
      # Self-host default: no session quota (docs/CLOUD_SYNC.md "Limits").
      SYNC_SESSION_QUOTA: "0"
      # Session-cookie secret — set once and keep it stable across restarts
      # (README "Environment").
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?run with BETTER_AUTH_SECRET set, e.g. $(openssl rand -hex 32)}
      # Optional: enable "Continue with GitHub" by creating an OAuth app with
      # callback ${BETTER_AUTH_URL}/api/auth/callback/github.
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sgbw
    volumes:
      - sgbw-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sgbw"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  sgbw-pgdata:
